name: CI

# Deploys are done by Cloudflare Workers Builds (the Cloudflare GitHub app);
# this workflow only checks that the site formats and builds.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
